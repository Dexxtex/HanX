allowBuilds:
  esbuild: true
# Override di sicurezza per dipendenze transitive di stremio-addon-sdk/socks:
# - path-to-regexp 0.1.13 chiude le ReDoS di 0.1.x (via router)
# - tmp 0.2.7 chiude il path traversal di 0.2.x (via inquirer>external-editor)
# - ip-address 10.7.4 chiude il ReDoS di Address6 (via socks)
# - body-parser 1.20.9 e 2.4.0 chiudono la DoS da body compresso (GHSA, 11/2026)
# - qs 6.16.1 chiude il TypeError su arrayFormat 'comma' (DoS, 11/2026)
overrides:
  path-to-regexp@<0.1.13: 0.1.13
  tmp@<0.2.6: 0.2.7
  ip-address@<=10.7.3: 10.7.4
  body-parser@<1.20.9: 1.20.9
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  qs@>=6.7.0 <=6.16.0: 6.16.1
