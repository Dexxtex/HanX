# Override per host Linux con IPv6 funzionante (es. mini PC / server casalingo).
#
# Serve quando il provider blocca l'IPv4 pubblico ma l'IPv6 passa: con la rete
# bridge di default il container esce solo su IPv4. Con network_mode: host usa
# lo stack dell'host (IPv6 compreso) e --dns-result-order=ipv6first evita che
# l'IPv4, che risponde subito 403, vinca la selezione automatica.
#
# Uso:  docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
# (richiede Docker Compose v2.24+ per il tag !reset)
services:
  hanx:
    network_mode: host
    ports: !reset []
    environment:
      - NODE_OPTIONS=--enable-source-maps --dns-result-order=ipv6first
