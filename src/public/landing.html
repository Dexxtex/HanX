<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANX</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 2em; max-width: 800px; margin: auto; background: #1a1a1a; color: #e0e0e0; }
        h1 { color: #ae4545; }
        a { color: #ae4545; }
    .install-button-container { padding: 2em 0; }
    .install-button { display: inline-block; padding: 12px 24px; background-color: #ae4545; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 1.1em; }
    /* Ensure single-column layout for the whole page */
    html, body { max-width: 900px; margin: 0 auto; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(140,82,255,0.3);} 70% { box-shadow: 0 0 0 16px rgba(140,82,255,0);} 100% { box-shadow: 0 0 0 0 rgba(140,82,255,0);} }
    </style>
</head>
<body>
    <h1>HANX</h1>
    <p>HANX addon con AnimeUnity, AnimeSaturn, AnimeWorld</p>

    <div class="install-button-container">
        <a id="install-link" href="#" class="install-button">Install Addon</a>
    </div>
    <script>
        const installLink = document.getElementById('install-link');
        const manifestUrl = `${window.location.protocol}//${window.location.host}/manifest.json`;
        installLink.href = `stremio://install-addon/${encodeURIComponent(manifestUrl)}`;

    </script>
</body>
</html>
