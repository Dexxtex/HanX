services:
  hanx:
    container_name: HanX
    # Immagine pubblicata dalla CI su Docker Hub (amd64 + arm64).
    # Per una build locale: docker compose build.
    image: lextutor/hanx:latest
    env_file:
      # .env is optional and usually absent in git stacks.
      - path: .env
        required: false
      # Dockhand writes non-secret Environment-tab overrides here.
      - path: .env.dockhand
        required: false
    ports:
      - "7000:7000"
    volumes:
      - hanx-data:/app/data
    environment:
      - PORT=7000
      # Mapping incrementale: Jikan locale + file indice/cursore nel volume.
      - JIKAN_API_BASE=${JIKAN_API_BASE:-http://jikan_rest:8080/v4}
      - ANIME_MAPPING_FILE=/app/data/anime-seasons.json
      - ANIME_MAPPING_STATE=/app/data/jikan-progress.json
      # Chiavi API e EasyProxy: Dockhand inietta i secret nel processo compose,
      # in alternativa arrivano dal .env caricato sopra.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - TVDB_PIN=${TVDB_PIN:-}
      - EASYPROXY_URL=${EASYPROXY_URL:-}
      - EASYPROXY_PASSWORD=${EASYPROXY_PASSWORD:-}
      # Forward proxy per ricerca e pagine di riproduzione: si attivano appena
      # impostati. Il proxy della piattaforma precede PROXY, poi il diretto.
      - PROXY=${PROXY:-}
      - AU_PROXY=${AU_PROXY:-}
      - AS_PROXY=${AS_PROXY:-}
      - AW_PROXY=${AW_PROXY:-}
    restart: unless-stopped

volumes:
  hanx-data:
