services:
  hanx:
    container_name: HanX
    # Immagine pubblicata dalla CI su Docker Hub (amd64 + arm64).
    image: lextutor/hanx:latest
    # `ports` e il container devono ricevere lo stesso PORT: compose lo legge dal
    # `.env` o dalla shell, `env_file` no.
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    environment:
      PORT: "${PORT:-7000}"
    volumes:
      - hanx-data:/app/data
    # Tutte le variabili stanno in .env (obbligatorie e opzionali, vedi
    # env.example)
    env_file:
      - .env
    restart: unless-stopped

volumes:
  hanx-data:
