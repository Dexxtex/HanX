services:
  hanx:
    container_name: HanX
    # Immagine pubblicata dalla CI su Docker Hub (amd64 + arm64).
    image: lextutor/hanx:latest
    # PORT nel .env decide anche la mappatura della porta.
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    volumes:
      - hanx-data:/app/data
    # Tutte le variabili stanno in .env (obbligatorie e opzionali, vedi
    # .env.example)
    env_file:
      - .env
    restart: unless-stopped

volumes:
  hanx-data:
