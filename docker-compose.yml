services:
  hanx:
    container_name: HanX
    build: .
    env_file:
      - .env
    ports:
      - "7000:7000"
    volumes:
      - hanx-data:/app/data
    environment:
      - PORT=7000
      # Opzionale: chiavi API
      # - TMDB_API_KEY=your_key_here
      # Opzionale: MediaFlow Proxy
      # - MFP_URL=http://localhost:3000
      # - MFP_PSW=your_password
      # Opzionale: URL base addon per evitare loop con VixSrc
      # - ADDON_BASE_URL=https://tuo-dominio.com
      # Opzionale: abilita/disabilita provider
      # - ANIMEUNITY_ENABLED=true
      # - ANIMESATURN_ENABLED=true
      # - ANIMEWORLD_ENABLED=true
    restart: unless-stopped

volumes:
  hanx-data:
