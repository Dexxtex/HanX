services:
  hanx:
    container_name: HanX
    build: .
    env_file:
      - .env
    ports:
      - "7000:7000"
    volumes:
      - hanx-data:/app/data
    environment:
      - PORT=7000
      # Opzionale: chiavi API
      # - TMDB_API_KEY=your_key_here
      # - TVDB_API_KEY=your_key_here
      # - TVDB_PIN=your_pin
      # Opzionale: EasyProxy (servizio esterno)
      # - EASYPROXY_URL=http://host.docker.internal:7860
      # - EASYPROXY_PASSWORD=your_password
      # Opzionale: abilita/disabilita provider
      # - ANIMEUNITY_ENABLED=true
      # - ANIMESATURN_ENABLED=true
      # - ANIMEWORLD_ENABLED=true
    restart: unless-stopped

volumes:
  hanx-data:
