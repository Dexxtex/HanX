name: Catalog Sync

# Catalogo locale dei tre siti (AnimeSaturn, AnimeWorld, AnimeUnity), usato dai
# provider per il match offline dei titoli.
#
# Il catalogo NON vive sul branch del codice: viene pubblicato sul branch orfano
# `data` con un solo commit (force-push, niente storia), così i 4-7 MB di JSON
# non gonfiano il repository. L'addon lo scarica da CATALOG_URL.
#
# Due cron perché GitHub li vuole in UTC e l'ora legale sposta l'offset
# (18:37 UTC = 20:37 CEST, 19:37 UTC = 20:37 CET). Il rilevo del crawl è affidato
# al guard "già sincronizzato oggi", non all'ora di Roma: GitHub ritarda le
# partenze schedulate anche di ore, e a metà notte il controllo dell'ora scartava
# in silenzio tutte le run.
#
# GitHub disattiva i workflow schedulati dopo 60 giorni senza attività nel
# repository. Per riattivarlo: Actions -> "Catalog Sync" -> "Enable workflow",
# oppure lanciare una volta "Run workflow" (workflow_dispatch), che non è
# soggetto al guard e aggiorna subito il catalogo.

on:
  schedule:
    # Due finestre per stagione, mai al minuto 0: il cron di GitHub in picco
    # ritarda o scarta le run in silenzio, e la seconda finestra è la copia di
    # riserva. Il guard "già sincronizzato oggi" impedisce il doppio crawl.
    - cron: '07 19 * * *' # 20:07 CET
    - cron: '37 19 * * *' # 20:37 CET
    - cron: '07 18 * * *' # 20:07 CEST
    - cron: '37 18 * * *' # 20:37 CEST
  workflow_dispatch: {}

# Il job scrive il branch `data`: serve solo contents: write.
permissions:
  contents: write

# Due run sullo stesso catalogo si sovrascriverebbero.
concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # I secret dell'environment `CATALOG` (CATALOG_PROXY) arrivano solo se il job
    # lo dichiara. L'environment non ha regole di protezione: il cron gira da solo.
    environment: CATALOG
    # Timeout con margine per il crawl dei provider e il backfill malId.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Il catalogo di ieri vive sul branch `data`, non nel workspace: senza
      # questo ripristino la guardia 70% non avrebbe termine di confronto e un
      # sito bloccato pubblicherebbe una lista vuota al posto dei suoi dati.
      - name: Ripristina il catalogo pubblicato
        run: |
          mkdir -p data
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:catalogs.json > data/catalogs.json 2>/dev/null || true
            git show FETCH_HEAD:catalog-titles.json > data/catalog-titles.json 2>/dev/null || true
            git show FETCH_HEAD:last-sync.txt > data/last-sync.txt 2>/dev/null || rm -f data/last-sync.txt
            [ -s data/last-sync.txt ] || rm -f data/last-sync.txt
            echo "Ripristinate $(node -e "const d=require('./data/catalogs.json');console.log(Object.values(d.sites).reduce((n,l)=>n+l.length,0))") schede dal branch data."
          else
            echo "Branch data assente: primo sync, il catalogo parte vuoto."
          fi

      # Due finestre per stagione: se la prima ha già sincronizzato stasera, questa è
      # la copia di riserva e non deve rifare il crawl.
      - name: Guard già sincronizzato oggi
        id: fresh
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Esecuzione manuale (workflow_dispatch): guard disattivato."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date +%s)
          last=""
          if [ -s data/last-sync.txt ]; then
            last=$(tr -d '[:space:]' < data/last-sync.txt)
          fi
          # Compatibilità con formato legacy YYYY-MM-DD
          today=$(TZ=Europe/Rome date +%F)
          if [ "$last" = "$today" ]; then
            echo "Catalogo già sincronizzato oggi ($last): nessun crawl."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_epoch=""
          if [ -n "$last" ]; then
            if [[ "$last" =~ ^[0-9]+$ ]]; then
              last_epoch="$last"
            else
              last_epoch=$(date -d "$last" +%s 2>/dev/null || true)
            fi
          fi
          if [ -n "$last_epoch" ] && [ $(( now - last_epoch )) -lt 57600 ]; then
            echo "Catalogo già sincronizzato ($last): nessun crawl."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      # Se un sito risponde 403/429 o scende sotto il 70% delle schede, il suo
      # catalogo resta quello di ieri; gli altri si aggiornano lo stesso e lo
      # script esce 1, così il job è rosso (GitHub manda la notifica).
      # CATALOG_PROXY è un IP residenziale: i runner escono da datacenter e il
      # WAF di AnimeUnity risponde 403. Va in un secret (contiene credenziali),
      # serve una sessione sticky (stesso IP per tutta la run) e non è un fix
      # del blocco. Vuoto = nessun proxy.
      - name: Sync catalogo
        id: sync
        if: steps.fresh.outputs.should_run == 'true'
        env:
          CATALOG_PROXY: ${{ secrets.CATALOG_PROXY }}
          # Backfill malId: 300 schede per run, stop a 52' (il job ha 60').
          CATALOG_MALID_MAX_REQUESTS: 300
          CATALOG_MALID_DEADLINE_MIN: 52
        run: pnpm run sync-catalog

      # `always()`: anche con il sync rosso i siti riusciti vanno pubblicati.
      - name: Pubblica sul branch data
        if: always() && steps.fresh.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [ ! -f data/catalog-titles.json ] || [ ! -f data/catalogs.json ]; then
            echo "Nessun catalogo scritto: niente da pubblicare."
            exit 1
          fi
          work=$(mktemp -d)
          cp data/catalogs.json data/catalog-titles.json "$work"/
          # Il marcatore si aggiorna solo a sync completato con successo: se fallisce,
          # si preserva il marcatore precedente così la finestra di riserva può ritentare.
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > "$work/last-sync.txt"
          elif [ -s data/last-sync.txt ]; then
            cp data/last-sync.txt "$work"/
          fi
          cd "$work"
          git init -q -b data
          git add catalogs.json catalog-titles.json
          if [ -s last-sync.txt ]; then
            git add last-sync.txt
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "chore(catalog): sync $(TZ=Europe/Rome date +%F)"
          git remote add origin "$REPO_URL"
          # generatedAt cambia ogni sera: senza escluderlo si pubblicherebbe
          # una versione nuova anche quando le schede sono identiche.
          changed=true
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            changed=false
            for file in catalogs.json catalog-titles.json; do
              if git show "FETCH_HEAD:$file" 2>/dev/null | jq 'del(.generatedAt)' > old.json; then
                if ! jq 'del(.generatedAt)' "$file" | diff -q - old.json > /dev/null; then
                  changed=true
                fi
              else
                changed=true
              fi
            done
            # Il marcatore deve aggiornarsi anche quando il catalogo è identico,
            # altrimenti la finestra di riserva rifarebbe il crawl.
            last=$(git show FETCH_HEAD:last-sync.txt 2>/dev/null || true)
            current_marker=""
            if [ -s last-sync.txt ]; then
              current_marker=$(tr -d '[:space:]' < last-sync.txt)
            fi
            if [ -n "$current_marker" ] && [ "$(tr -d '[:space:]' <<< "$last")" != "$current_marker" ]; then
              changed=true
            fi
          fi
          if [ "$changed" = false ]; then
            echo "Solo generatedAt: il catalogo è identico a quello pubblicato."
            exit 0
          fi
          git push -q -f origin data
          echo "Pubblicato su data: $(jq '.sites' catalogs.json | jq -c 'map_values(length)')"
