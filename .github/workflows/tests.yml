name: Tests

# La suite gira su push e pull request: `catalog.yml` ha solo schedule e
# dispatch, quindi senza questo workflow una regressione arriverebbe in
# produzione e si vedrebbe la notte dopo.
#
# In CI girano i test tracciati (`tests/ops/`): il resto di `tests/` e'
# gitignorato per scelta e resta locale.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm test` compila prima (`tsc`): i test importano da `dist/`.
      - name: Test
        run: pnpm test
