name: Build and Publish Docker image
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  # Lanciato dal bump di versione: il push del tag fatto con GITHUB_TOKEN
  # non crea run, quindi il build sulla tag va invocato esplicitamente.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: lexturor/hanx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB != '' }}
          HAS_VAR: ${{ vars.DOCKERHUB != '' }}
        run: |
          echo "secret DOCKERHUB: $HAS_TOKEN"
          echo "variable DOCKERHUB (posto sbagliato): $HAS_VAR"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Manca il secret DOCKERHUB col token Docker Hub (Read & Write). Settings > Secrets and variables > Actions > Repository secrets, non 'Variables'."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Username pubblico (stesso namespace dell'immagine): il secret e' solo il token.
          username: lexturor
          password: ${{ secrets.DOCKERHUB }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Generate artifact attestation (GHCR)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.GHCR }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
