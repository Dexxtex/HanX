name: Crea PR da Issue di normalizzazione (AnimeSaturn)

on:
  issues:
    types: [opened, edited]

jobs:
  generate-pr:
    if: |
      (contains(github.event.issue.labels.*.name, 'normalizzazione') ||
       contains(github.event.issue.labels.*.name, 'richiesta')) &&
      !contains(github.event.issue.labels.*.name, 'normalizzazione-animeunity') &&
      !contains(github.event.issue.labels.*.name, 'normalizzazione-animeworld')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          MAL_NAME=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### MAL English name/{getline; while($0 ~ /^ *$/){getline}; print $0}')
          AS_NAME=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### AnimeSaturn name/{getline; while($0 ~ /^ *$/){getline}; print $0}')
          if [ -z "$MAL_NAME" ] || [ -z "$AS_NAME" ]; then
            echo "Campi MAL/AnimeSaturn mancanti nella issue." >&2
            exit 1
          fi
          echo "mal_name=$MAL_NAME" >> "$GITHUB_OUTPUT"
          echo "as_name=$AS_NAME" >> "$GITHUB_OUTPUT"

      - name: Aggiungi riga di normalizzazione
        env:
          MAL_NAME: ${{ steps.parse.outputs.mal_name }}
          AS_NAME: ${{ steps.parse.outputs.as_name }}
        run: python3 scripts/auto_normalize.py

      - name: Crea PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(normalize): add \"${{ steps.parse.outputs.mal_name }}\""
          branch: "normalizza-${{ github.event.issue.number }}"
          title: "Normalizzazione: ${{ steps.parse.outputs.mal_name }}"
          body: |
            ## 🔗 Nuova normalizzazione

            | Campo | Valore |
            |-------|--------|
            | **MAL English name** | ${{ steps.parse.outputs.mal_name }} |
            | **AnimeSaturn name** | ${{ steps.parse.outputs.as_name }} |

            ### Checklist
            - [ ] Compilazione corretta secondo Issue
            - [ ] I test esistenti passano
            - [ ] Non rompe altre normalizzazioni

            _Questa PR è stata generata automaticamente dalla Issue #${{ github.event.issue.number }}._
