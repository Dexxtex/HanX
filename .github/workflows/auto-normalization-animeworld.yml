name: Crea PR da Issue di normalizzazione (AnimeWorld)

on:
  issues:
    types: [opened, edited]

jobs:
  generate-pr-animeworld:
    if: |
      contains(github.event.issue.labels.*.name, 'normalizzazione-animeworld') ||
      contains(github.event.issue.labels.*.name, 'richiesta-animeworld')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          MAL_NAME=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### MAL English name/{getline; while($0 ~ /^ *$/){getline}; print $0}')
          AW_NAME=$(printf '%s\n' "$ISSUE_BODY" | awk '/^### AnimeWorld name/{getline; while($0 ~ /^ *$/){getline}; print $0}')
          if [ -z "$MAL_NAME" ] || [ -z "$AW_NAME" ]; then
            echo "Campi MAL/AnimeWorld mancanti nella issue." >&2
            exit 1
          fi
          echo "mal_name=$MAL_NAME" >> "$GITHUB_OUTPUT"
          echo "aw_name=$AW_NAME" >> "$GITHUB_OUTPUT"

      - name: Aggiungi riga di normalizzazione AnimeWorld
        env:
          MAL_NAME: ${{ steps.parse.outputs.mal_name }}
          AW_NAME: ${{ steps.parse.outputs.aw_name }}
        run: python3 scripts/auto_normalize_animeworld.py

      - name: Crea PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(normalize-aw): add \"${{ steps.parse.outputs.mal_name }}\""
          branch: "normalizza-aw-${{ github.event.issue.number }}"
          title: "Normalizzazione AnimeWorld: ${{ steps.parse.outputs.mal_name }}"
          body: |
            ## 🔗 Nuova normalizzazione AnimeWorld

            | Campo | Valore |
            |-------|--------|
            | **MAL English name** | ${{ steps.parse.outputs.mal_name }} |
            | **AnimeWorld name** | ${{ steps.parse.outputs.aw_name }} |

            ### Checklist
            - [ ] Compilazione corretta secondo Issue
            - [ ] I test esistenti passano
            - [ ] Non rompe altre normalizzazioni

            _Questa PR è stata generata automaticamente dalla Issue #${{ github.event.issue.number }}._
