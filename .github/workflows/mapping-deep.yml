name: Mapping deep

# Recupero settimanale degli esiti che la run notturna lascia indietro.
#
# La run notturna (`catalog.yml`) converte solo le entry nuove e riapre
# `no-align`: e' un lavoro di mantenimento, non di recupero. Gli altri esiti
# (`no-tmdb`, `no-tvdb`, `no-kitsu`) restano fermi perche' riaprirli ogni notte
# rimetterebbe in coda migliaia di entry che quasi sempre falliscono di nuovo.
#
# Una volta a settimana, con un tetto alto, si ritenta tutto: quello che nel
# frattempo e' comparso su TMDB/TVDB/Kitsu viene recuperato, il resto torna in
# fondo alla coda e non blocca niente.
#
# Perche' non e' dentro `catalog.yml`: il job notturno ha `timeout-minutes: 90`
# e la sequenza sync -> enrich -> mapping. Un retry da migliaia di entry
# allungherebbe il job di ore e ritarderebbe il catalogo del giorno dopo.

on:
  schedule:
    # Domenica 04:10 UTC: lontano dalle due finestre del catalogo (18:37 e
    # 19:37 UTC) e dal probe delle 03:00.
    - cron: '10 4 * * 0'
  workflow_dispatch:
    inputs:
      retry-limit:
        description: 'Entry da ritentare in questa run'
        default: '4000'
      limit:
        description: 'Entry nuove da convertire'
        default: '300'

permissions:
  contents: write

# Stesso gruppo del job notturno: due scrittori sul branch `mapping` si
# sovrascriverebbero (il publish e' un force-push).
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    # 4.000 entry a ~1 s l'una sono ~70 minuti; il margine copre i retry HTTP.
    timeout-minutes: 150
    env:
      JIKAN_API_BASE: https://api.tenrai.org/v1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_MAPPING_BRANCH: mapping
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      TVDB_PIN: ${{ secrets.TVDB_PIN }}
      ANIME_MAPPING_FILE: data/anime-seasons.json
      ANIME_MAPPING_STATE: data/jikan-progress.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Ripristina indice e cursore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          branch_status=0
          git ls-remote --exit-code --heads origin "$GITHUB_MAPPING_BRANCH" >/dev/null 2>&1 \
            || branch_status=$?
          if [ "$branch_status" -eq 0 ]; then
            git fetch --depth=1 origin \
              "refs/heads/$GITHUB_MAPPING_BRANCH:refs/remotes/origin/$GITHUB_MAPPING_BRANCH"
            for file in anime-seasons.json jikan-progress.json; do
              git cat-file -e "origin/$GITHUB_MAPPING_BRANCH:$file"
              git show "origin/$GITHUB_MAPPING_BRANCH:$file" > "data/$file"
            done
          elif [ "$branch_status" -eq 2 ]; then
            echo "branch $GITHUB_MAPPING_BRANCH assente: provo la vecchia release"
            gh release download mapping --pattern 'anime-seasons.json' --dir data --clobber \
              || echo "nessun indice pubblicato: prima build"
            gh release download mapping --pattern 'jikan-progress.json' --dir data --clobber \
              || echo "nessun cursore pubblicato: riparte dal catalogo"
          else
            echo "git ls-remote fallito (exit $branch_status): non pubblico un indice parziale" >&2
            exit 1
          fi

      - name: Ritenta tutti gli esiti e pubblica
        run: >-
          node scripts/build/build-anime-mapping.mjs
          --limit=${{ inputs.limit || 300 }}
          --titleit-cap=600
          --publish
          --retry=no-align,no-tmdb,no-tvdb,no-kitsu
          --retry-limit=${{ inputs.retry-limit || 4000 }}

      - name: Stato finale
        if: always()
        run: node scripts/build/build-anime-mapping.mjs --status
